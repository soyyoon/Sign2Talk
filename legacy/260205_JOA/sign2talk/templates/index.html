<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Sign2Talk · Live</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top left, #1f2937, #020617 60%);
        color: #e5e7eb;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame-shell {
        background: rgba(15, 23, 42, 0.9);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
      .title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 0 4px;
      }
      .title-bar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ef4444;
      }
      .title-accent {
        color: #22d3ee;
        font-weight: 600;
      }
      .hint {
        font-size: 12px;
        color: #6b7280;
      }
      .video-frame {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: #020617;
        contain: layout style paint; /* 브라우저 렌더링 최적화 */
      }
      .video-frame img {
        display: block;
        max-width: 100%;
        height: auto;
        image-rendering: auto; /* 렌더링 최적화 */
        transform: translateZ(0); /* GPU 가속 */
        backface-visibility: hidden; /* 렌더링 최적화 */
        -webkit-backface-visibility: hidden;
        -webkit-transform: translateZ(0);
      }
    </style>
  </head>
  <body>
    <div class="frame-shell">
      <div class="title-bar">
        <div class="title-bar-left">
          <span class="dot"></span>
          <span>Sign2Talk</span>
          <span class="title-accent">Live</span>
        </div>
        <div class="hint">브라우저에서만 실행 중 · Python 서버 필요</div>
      </div>
      <div class="video-frame">
        <img
          src="/video_feed"
          alt="Sign2Talk Live"
          loading="eager"
          decoding="async"
        />
      </div>
    </div>
    <script>
      // 키보드 이벤트를 서버로 전송
      document.addEventListener("keydown", function (e) {
        const key = e.key.toLowerCase();
        // Space, 0, r, q만 처리
        if (key === " " || key === "0" || key === "r" || key === "q") {
          e.preventDefault();
          fetch("/key", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: key }),
          }).catch((err) => console.error("키 전송 실패:", err));
        }
      });

      // 잔상 방지: 이미지가 제대로 업데이트되도록 강제
      const videoImg = document.getElementById("videoStream");
      let errorCount = 0;
      
      videoImg.addEventListener("error", function() {
        errorCount++;
        // 에러 발생 시 이미지 소스 강제 갱신
        if (errorCount < 10) {
          videoImg.src = "/video_feed?t=" + Date.now();
        }
      });
      
      // 주기적으로 이미지가 살아있는지 확인 (잔상 방지)
      setInterval(function() {
        if (videoImg.complete && videoImg.naturalWidth > 0) {
          errorCount = 0; // 정상 작동 중이면 에러 카운트 리셋
        }
      }, 2000);
    </script>
  </body>
</html>
